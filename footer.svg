<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 70" width="900" height="70" role="img" aria-label="thank you for visiting">
<style>@font-face{font-family:'PR';src:url(data:font/woff2;base64,) format('woff2');}
.rise{opacity:0;animation:rise 1.6s cubic-bezier(.22,.61,.36,1) forwards}
.fade{opacity:0;animation:fade 1.8s ease-in-out forwards}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
</style>
<defs><linearGradient id="bg" x1="0" x2="1"><stop offset="0" stop-color="#F6F9F0"/><stop offset="1" stop-color="#DCE8CE"/></linearGradient></defs>
<rect width="900" height="70" rx="14" fill="url(#bg)" stroke="#B9CDA8" stroke-width="1.5"/>
<text class="rise" x="450" y="42" text-anchor="middle" font-family="PR,'Segoe UI',Arial,sans-serif" font-size="16" letter-spacing="3" fill="#7A1F2B">thank you for visiting</text>
</svg>