<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <clipPath id="bannerClip">
      <rect width="1200" height="300" rx="16" />
    </clipPath>

    <!-- Deep grey-blue cybercore base -->
    <linearGradient id="baseBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14" />
      <stop offset="35%" stop-color="#111C2E" />
      <stop offset="70%" stop-color="#1A2942" />
      <stop offset="100%" stop-color="#0A101D" />
    </linearGradient>

    <!-- Volumetric blue light beams -->
    <linearGradient id="beamL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="beamR" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0" />
    </linearGradient>

    <!-- Glowing CD / optical disc gradient -->
    <radialGradient id="cdOuter" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#BAE6FD" stop-opacity="0.9" />
      <stop offset="35%" stop-color="#38BDF8" stop-opacity="0.65" />
      <stop offset="70%" stop-color="#1D4ED8" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.85" />
    </radialGradient>
    <linearGradient id="cdShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.65" />
      <stop offset="40%" stop-color="#7DD3FC" stop-opacity="0.1" />
      <stop offset="60%" stop-color="#38BDF8" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Metallic chrome sphere gradient -->
    <radialGradient id="chromeOrb" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#CBD5E1" />
      <stop offset="65%" stop-color="#475569" />
      <stop offset="100%" stop-color="#0F172A" />
    </radialGradient>

    <!-- Liquid chrome text gradient -->
    <linearGradient id="chromeText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="28%" stop-color="#E2E8F0" />
      <stop offset="50%" stop-color="#7DD3FC" />
      <stop offset="70%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>

    <!-- Glowing horizontal divider -->
    <linearGradient id="lineGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0" />
      <stop offset="25%" stop-color="#38BDF8" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#E0F2FE" stop-opacity="1" />
      <stop offset="75%" stop-color="#38BDF8" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </linearGradient>

    <!-- Cyber mesh grid -->
    <pattern id="cyberGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#38BDF8" stroke-opacity="0.10" stroke-width="1" />
    </pattern>

    <!-- CRT scanlines -->
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#BAE6FD" fill-opacity="0.05" />
    </pattern>

    <!-- Electric blue glow filter -->
    <filter id="blueGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="9" result="blur1" />
      <feGaussianBlur stdDeviation="3" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g clip-path="url(#bannerClip)">
    <!-- Base background + grid -->
    <rect width="1200" height="300" fill="url(#baseBg)" />
    <rect width="1200" height="300" fill="url(#cyberGrid)" />

    <!-- Volumetric light beams -->
    <polygon points="0,0 420,0 180,300 0,300" fill="url(#beamL)" />
    <polygon points="820,0 1200,0 1200,300 680,300" fill="url(#beamR)" />

    <!-- Wireframe cyber globe rings (left) -->
    <g stroke="#38BDF8" stroke-opacity="0.22" fill="none" stroke-width="1.2">
      <circle cx="170" cy="150" r="135" />
      <ellipse cx="170" cy="150" rx="135" ry="52" />
      <ellipse cx="170" cy="150" rx="135" ry="96" />
      <ellipse cx="170" cy="150" rx="52" ry="135" />
      <ellipse cx="170" cy="150" rx="96" ry="135" />
    </g>

    <!-- Glowing Y2K Optical Disc / CD (center-left accent) -->
    <g transform="translate(215, 195)">
      <circle r="76" fill="url(#cdOuter)" stroke="#7DD3FC" stroke-opacity="0.7" stroke-width="1.5" />
      <circle r="76" fill="url(#cdShine)" />
      <circle r="54" fill="none" stroke="#E0F2FE" stroke-opacity="0.25" stroke-width="1" />
      <circle r="24" fill="#0B1120" fill-opacity="0.7" stroke="#94A3B8" stroke-width="2" />
      <circle r="11" fill="#070B14" stroke="#38BDF8" stroke-width="1.2" />
    </g>

    <!-- Floating metallic chrome orbs (right) -->
    <circle cx="1030" cy="88" r="36" fill="url(#chromeOrb)" stroke="#94A3B8" stroke-opacity="0.5" stroke-width="1" />
    <circle cx="1095" cy="185" r="22" fill="url(#chromeOrb)" stroke="#7DD3FC" stroke-opacity="0.6" stroke-width="1" />
    <circle cx="965" cy="215" r="12" fill="url(#chromeOrb)" />

    <!-- Center dark radial backing for sharp text contrast -->
    <ellipse cx="600" cy="150" rx="380" ry="115" fill="#070B14" fill-opacity="0.55" />

    <!-- CRT scanlines -->
    <rect width="1200" height="300" fill="url(#scanlines)" />

    <!-- HUD frame & glowing divider lines -->
    <rect x="14" y="14" width="1172" height="272" rx="10" fill="none" stroke="#64748B" stroke-opacity="0.4" stroke-width="1" />
    <line x1="120" y1="36" x2="1080" y2="36" stroke="url(#lineGlow)" stroke-width="1.2" />
    <line x1="120" y1="264" x2="1080" y2="264" stroke="url(#lineGlow)" stroke-width="1.2" />

    <!-- Corner brackets -->
    <path d="M 32 54 L 32 32 L 54 32" fill="none" stroke="#38BDF8" stroke-width="2" />
    <path d="M 1168 54 L 1168 32 L 1146 32" fill="none" stroke="#38BDF8" stroke-width="2" />
    <path d="M 32 246 L 32 268 L 54 268" fill="none" stroke="#38BDF8" stroke-width="2" />
    <path d="M 1168 246 L 1168 268 L 1146 268" fill="none" stroke="#38BDF8" stroke-width="2" />

    <!-- HUD micro labels -->
    <text x="64" y="42" font-family="&#39;JetBrains Mono&#39;,&#39;Fira Code&#39;,Consolas,monospace" font-size="11" letter-spacing="3" fill="#CBD5E1">SYS://KAIMNANCY</text>
    <text x="1136" y="42" text-anchor="end" font-family="&#39;JetBrains Mono&#39;,&#39;Fira Code&#39;,Consolas,monospace" font-size="11" letter-spacing="3" fill="#7DD3FC">ONLINE ●</text>

    <!-- Y2K Cybercore star & cross accents -->
    <text x="275" y="168" text-anchor="middle" font-family="monospace" font-size="36" fill="#7DD3FC" filter="url(#blueGlow)">✦</text>
    <text x="225" y="138" text-anchor="middle" font-family="monospace" font-size="20" fill="#E2E8F0">+</text>
    <circle cx="242" cy="186" r="5" fill="none" stroke="#38BDF8" stroke-width="1.5" />

    <text x="925" y="168" text-anchor="middle" font-family="monospace" font-size="36" fill="#7DD3FC" filter="url(#blueGlow)">✦</text>
    <text x="975" y="138" text-anchor="middle" font-family="monospace" font-size="20" fill="#E2E8F0">+</text>
    <circle cx="958" cy="186" r="5" fill="none" stroke="#38BDF8" stroke-width="1.5" />

    <!-- Main metallic chrome title with electric blue glow -->
    <text x="600" y="180" text-anchor="middle" font-family="&#39;Orbitron&#39;,&#39;Eurostile&#39;,&#39;Segoe UI&#39;,system-ui,sans-serif" font-size="108" font-weight="900" letter-spacing="18" fill="#38BDF8" fill-opacity="0.6" filter="url(#blueGlow)">NANCY</text>

    <text x="600" y="180" text-anchor="middle" font-family="&#39;Orbitron&#39;,&#39;Eurostile&#39;,&#39;Segoe UI&#39;,system-ui,sans-serif" font-size="108" font-weight="900" letter-spacing="18" fill="url(#chromeText)" stroke="#0F172A" stroke-width="2">NANCY</text>

    <!-- Bottom cybercore tagline -->
    <text x="600" y="244" text-anchor="middle" font-family="&#39;JetBrains Mono&#39;,&#39;Fira Code&#39;,Consolas,monospace" font-size="13" letter-spacing="5" fill="#E2E8F0">° · { CS Researcher } · °</text>
  </g>

  <!-- Outer border -->
  <rect width="1200" height="300" rx="16" fill="none" stroke="#334155" stroke-width="2" />
</svg>
