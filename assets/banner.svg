<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" role="img" aria-label="Nancy - frontend developer from India">
<style>@font-face{font-family:'GV';src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'CGI';src:url(data:font/woff2;base64,) format('woff2');}
.rise{opacity:0;animation:rise 1.8s cubic-bezier(.22,.61,.36,1) forwards}
.fade{opacity:0;animation:fade 2s ease-in-out forwards}
.tw{animation:tw 3.2s ease-in-out infinite}
.fl{animation:fl 7s ease-in-out infinite}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes tw{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.15)}}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF0F6"/><stop offset=".5" stop-color="#FAD4E4"/><stop offset="1" stop-color="#F3A6C4"/></linearGradient>
<radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<linearGradient id="ln" x1="0" x2="1"><stop offset="0" stop-color="#D81B60" stop-opacity="0"/><stop offset=".5" stop-color="#D81B60"/><stop offset="1" stop-color="#D81B60" stop-opacity="0"/></linearGradient>
</defs>
<rect width="900" height="320" rx="28" fill="url(#bg)"/>
<rect x="8" y="8" width="884" height="304" rx="22" fill="none" stroke="#fff" stroke-opacity=".8" stroke-width="1.5" stroke-dasharray="2 7" stroke-linecap="round"/>
<ellipse cx="450" cy="150" rx="330" ry="120" fill="url(#glow)"/>
<g opacity=".55"><circle class="fl" cx="90" cy="230" r="46" fill="#fff" opacity=".45"/><circle class="fl" style="animation-delay:-2s" cx="820" cy="90" r="58" fill="#fff" opacity=".4"/><circle class="fl" style="animation-delay:-4s" cx="760" cy="260" r="30" fill="#fff" opacity=".5"/><circle class="fl" style="animation-delay:-1s" cx="150" cy="70" r="24" fill="#fff" opacity=".5"/></g>
<path class="tw" style="animation-delay:0s;transform-origin:120px 150px" d="M120 136 Q120 150 134 150 Q120 150 120 164 Q120 150 106 150 Q120 150 120 136Z" fill="#fff"/><path class="tw" style="animation-delay:0.8s;transform-origin:790px 170px" d="M790 152 Q790 170 808 170 Q790 170 790 188 Q790 170 772 170 Q790 170 790 152Z" fill="#fff"/><path class="tw" style="animation-delay:1.6s;transform-origin:210px 60px" d="M210 50 Q210 60 220 60 Q210 60 210 70 Q210 60 200 60 Q210 60 210 50Z" fill="#D81B60"/><path class="tw" style="animation-delay:0.4s;transform-origin:690px 60px" d="M690 48 Q690 60 702 60 Q690 60 690 72 Q690 60 678 60 Q690 60 690 48Z" fill="#fff"/><path class="tw" style="animation-delay:2.2s;transform-origin:250px 265px" d="M250 256 Q250 265 259 265 Q250 265 250 274 Q250 265 241 265 Q250 265 250 256Z" fill="#fff"/><path class="tw" style="animation-delay:1.2s;transform-origin:660px 262px" d="M660 251 Q660 262 671 262 Q660 262 660 273 Q660 262 649 262 Q660 262 660 251Z" fill="#D81B60"/>
<g class="fade" style="animation-delay:.2s" transform="translate(412 38)">
<path d="M0 34 L8 6 L24 24 L38 0 L52 24 L68 6 L76 34 Z" fill="#FFE3EE" stroke="#D81B60" stroke-width="2" stroke-linejoin="round"/>
<circle cx="8" cy="5" r="3.5" fill="#D81B60"/><circle cx="38" cy="-1" r="4" fill="#D81B60"/><circle cx="68" cy="5" r="3.5" fill="#D81B60"/>
<rect x="2" y="34" width="72" height="6" rx="3" fill="#F06292"/></g>
<text class="rise" style="animation-delay:.5s" x="450" y="200" text-anchor="middle" font-family="GV,'Brush Script MT',cursive" font-size="132" fill="#C2185B" stroke="#fff" stroke-width="1" paint-order="stroke">Nancy</text>
<rect class="fade" style="animation-delay:1.6s" x="250" y="222" width="400" height="2" fill="url(#ln)"/>
<path class="fade" style="animation-delay:1.8s" d="M450 229.3 C438.8 222.3 444.4 213.9 450 220.2 C455.6 213.9 461.2 222.3 450 229.3Z" fill="#D81B60"/>
<text class="rise" style="animation-delay:2s" x="450" y="268" text-anchor="middle" font-family="CGI,Georgia,serif" font-size="29" letter-spacing="1.5" fill="#8E2A56">a passionate frontend developer from India</text>
</svg>