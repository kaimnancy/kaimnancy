<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 150" width="900" height="150" role="img" aria-label="Nancy - frontend developer, India">
<style>@font-face{font-family:'PS';src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'PR';src:url(data:font/woff2;base64,) format('woff2');}
.rise{opacity:0;animation:rise 1.6s cubic-bezier(.22,.61,.36,1) forwards}
.fade{opacity:0;animation:fade 1.8s ease-in-out forwards}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
</style>
<defs><clipPath id="c"><rect width="900" height="150" rx="18"/></clipPath><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F6F9F0"/><stop offset="1" stop-color="#DCE8CE"/></linearGradient></defs>
<rect width="900" height="150" rx="18" fill="url(#bg)"/>
<rect width="900" height="150" rx="18" fill="none" stroke="#B9CDA8" stroke-width="1.5"/>
<g clip-path="url(#c)"><circle cx="70" cy="120" r="70" fill="#5E8A4F" opacity=".10"/><circle cx="840" cy="30" r="64" fill="#7A1F2B" opacity=".08"/></g>
<text class="rise" style="animation-delay:.2s" x="450" y="76" text-anchor="middle" font-family="PS,'Segoe UI',Arial,sans-serif" font-size="52" font-weight="600" letter-spacing="3" fill="#7A1F2B">Nancy</text>
<rect class="fade" style="animation-delay:1s" x="420" y="90" width="60" height="3" rx="1.5" fill="#5E8A4F"/>
<text class="rise" style="animation-delay:1.2s" x="450" y="123" text-anchor="middle" font-family="PR,'Segoe UI',Arial,sans-serif" font-size="15" letter-spacing="2" fill="#3F5A33">heavily unemployed and heavily overqualified</text>
</svg>
