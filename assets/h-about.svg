<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 50" width="600" height="50" role="img" aria-label="About Me">
<style>@font-face{font-family:'PS';src:url(data:font/woff2;base64,) format('woff2');}
.rise{opacity:0;animation:rise 1.6s cubic-bezier(.22,.61,.36,1) forwards}
.fade{opacity:0;animation:fade 1.8s ease-in-out forwards}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
</style>
<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#5E8A4F" stop-opacity="0"/><stop offset=".5" stop-color="#5E8A4F"/><stop offset="1" stop-color="#5E8A4F" stop-opacity="0"/></linearGradient></defs>
<text class="rise" x="300" y="28" text-anchor="middle" font-family="PS,'Segoe UI',Arial,sans-serif" font-size="22" font-weight="600" letter-spacing="1.5" fill="#B33A4B">About Me</text>
<rect class="fade" style="animation-delay:.6s" x="150" y="40" width="300" height="2" fill="url(#g)"/>
</svg>