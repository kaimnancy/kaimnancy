<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 96" width="800" height="96" role="img" aria-label="Contribution Bloom">
<style>@font-face{font-family:'GV';src:url(data:font/woff2;base64,) format('woff2');}
.rise{opacity:0;animation:rise 1.8s cubic-bezier(.22,.61,.36,1) forwards}
.fade{opacity:0;animation:fade 2s ease-in-out forwards}
.tw{animation:tw 3.2s ease-in-out infinite}
.fl{animation:fl 7s ease-in-out infinite}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes tw{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.15)}}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
</style>
<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#EC407A" stop-opacity="0"/><stop offset=".5" stop-color="#EC407A"/><stop offset="1" stop-color="#EC407A" stop-opacity="0"/></linearGradient></defs>
<text class="rise" x="400" y="54" text-anchor="middle" font-family="GV,cursive" font-size="54" fill="#E8528A">Contribution Bloom</text>
<rect class="fade" style="animation-delay:.8s" x="200" y="82" width="400" height="1.6" fill="url(#g)"/>
<path class="fade" style="animation-delay:1s" d="M400 88.4 C390.4 82.4 395.2 75.2 400 80.6 C404.8 75.2 409.6 82.4 400 88.4Z" fill="#EC407A"/>
<path class="tw" style="animation-delay:0s;transform-origin:330px 83px" d="M330 77 Q330 83 336 83 Q330 83 330 89 Q330 83 324 83 Q330 83 330 77Z" fill="#F8A5C2"/><path class="tw" style="animation-delay:1.1s;transform-origin:470px 83px" d="M470 77 Q470 83 476 83 Q470 83 470 89 Q470 83 464 83 Q470 83 470 77Z" fill="#F8A5C2"/>
</svg>