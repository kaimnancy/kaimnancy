  <text x="600" y="75" text-anchor="middle" font-family="&#39;JetBrains Mono&#39;,&#39;Fira Code&#39;,Consolas,monospace" font-size="12" letter-spacing="3" fill="#38BDF8">THANKS FOR VISITING // KAIMNANCY.EXE</text>
