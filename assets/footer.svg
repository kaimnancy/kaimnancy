<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 110" width="1200" height="110">
  <defs>
    <linearGradient id="footBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="glowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0" />
      <stop offset="30%" stop-color="#60A5FA" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#BAE6FD" stop-opacity="1" />
      <stop offset="70%" stop-color="#60A5FA" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#38BDF8" stroke-opacity="0.07" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1200" height="110" rx="12" fill="url(#footBg)" stroke="#334155" stroke-width="1.5" />
  <rect width="1200" height="110" rx="12" fill="url(#grid)" />
  <line x1="80" y1="22" x2="1120" y2="22" stroke="url(#glowLine)" stroke-width="1.2" />
  <line x1="80" y1="88" x2="1120" y2="88" stroke="url(#glowLine)" stroke-width="1.2" />

