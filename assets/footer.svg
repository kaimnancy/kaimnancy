<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 150" width="900" height="150" role="img" aria-label="thanks for visiting">
<style>@font-face{font-family:'GV';src:url(data:font/woff2;base64,) format('woff2');}
.rise{opacity:0;animation:rise 1.8s cubic-bezier(.22,.61,.36,1) forwards}
.fade{opacity:0;animation:fade 2s ease-in-out forwards}
.tw{animation:tw 3.2s ease-in-out infinite}
.fl{animation:fl 7s ease-in-out infinite}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes tw{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.15)}}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
</style>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF0F6"/><stop offset="1" stop-color="#F3A6C4"/></linearGradient></defs>
<rect width="900" height="150" rx="26" fill="url(#bg)"/>
<path class="tw" style="animation-delay:0s;transform-origin:150px 75px" d="M150 63 Q150 75 162 75 Q150 75 150 87 Q150 75 138 75 Q150 75 150 63Z" fill="#fff"/><path class="tw" style="animation-delay:1s;transform-origin:760px 60px" d="M760 46 Q760 60 774 60 Q760 60 760 74 Q760 60 746 60 Q760 60 760 46Z" fill="#fff"/><path class="tw" style="animation-delay:1.8s;transform-origin:690px 110px" d="M690 102 Q690 110 698 110 Q690 110 690 118 Q690 110 682 110 Q690 110 690 102Z" fill="#D81B60"/><path class="tw" style="animation-delay:0.6s;transform-origin:220px 110px" d="M220 101 Q220 110 229 110 Q220 110 220 119 Q220 110 211 110 Q220 110 220 101Z" fill="#D81B60"/>
<text class="rise" x="450" y="82" text-anchor="middle" font-family="GV,cursive" font-size="58" fill="#C2185B" stroke="#fff" stroke-width=".8" paint-order="stroke">thank you for visiting</text>
<path class="fade" style="animation-delay:1.4s" d="M450 122.2 C437.2 114.2 443.6 104.6 450 111.8 C456.4 104.6 462.8 114.2 450 122.2Z" fill="#D81B60"/>
</svg>